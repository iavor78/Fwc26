function getMatchInfo(matchNum) {
  const s = MATCH_SCHEDULE[matchNum];
  if (!s) return null;
  const [date, etH, etM, city] = s;
  // Convert ET to CEST (+6h)
  const etDate = new Date(date + "T" + String(etH).padStart(2,"0") + ":" + String(etM).padStart(2,"0") + ":00-05:00");
  // Use fixed offset: ET is UTC-5 (EDT), CEST is UTC+2, diff = +7
  // Actually ET during summer = EDT = UTC-4, CEST = UTC+2, diff = +6
  const cestDate = new Date(etDate.getTime() + 6 * 3600000);
  const days = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const dayStr = days[cestDate.getUTCDay()];
  const dateStr = `${dayStr} ${cestDate.getUTCDate()} ${months[cestDate.getUTCMonth()]}`;
  const timeStr = `${String(cestDate.getUTCHours()).padStart(2,"0")}:${String(cestDate.getUTCMinutes()).padStart(2,"0")} CEST`;
  return { dateStr, timeStr, city };
}

  appId:"1:966094907943:web:4e0e82e0941101147bfc02"
};

let firestoreDb=null;
let unsubscribe=null;
let lastSaveHash="";
let remoteUpdatePending=false;

async function initFirebase(){
  const {initializeApp}=await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js");
  const {getFirestore,doc,setDoc,onSnapshot}=await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
  const app=initializeApp(FB_CONFIG);
  firestoreDb=getFirestore(app);

  // Listen for real-time updates from other players
  const ref=doc(firestoreDb,"games","stl-wc26");
  unsubscribe=onSnapshot(ref,snap=>{
    if(!snap.exists()) return;
    const data=snap.data();
    if(!data||!data.state) return;
    // Only apply if it came from someone else (hash check)
    const hash=data.hash||"";
    if(hash===lastSaveHash) return;
    try{
      const parsed=JSON.parse(data.state);
      if(parsed&&parsed.playerNames){
        remoteUpdatePending=true;
        S=mergeState(parsed);
        remoteUpdatePending=false;
        updateSaveBar();
        render();
        showSyncFlash("↓ Updated from cloud");
      }
    }catch(e){}
  });
  return {getFirestore,doc,setDoc};
}

async function dbSave(state){
  if(!firestoreDb) return;
  try{
    const {doc,setDoc}=await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
    const json=JSON.stringify(state);
    const hash=btoa(json.slice(0,64)+json.length);
    lastSaveHash=hash;
    await setDoc(doc(firestoreDb,"games","stl-wc26"),{state:json,hash,updated:Date.now()});
  }catch(e){console.warn("Firestore save failed",e);}
}

function showSyncFlash(msg){
  let el=document.getElementById("syncFlash");
  if(!el) return;
  el.textContent=msg;el.style.opacity="1";
  setTimeout(()=>el.style.opacity="0",2500);
}

// ── URL ENCODE/DECODE ─────────────────────────────────────────────────────────
function encodeState(state){
  try{return btoa(unescape(encodeURIComponent(JSON.stringify(state))));}catch{return "";}
}
function decodeState(b64){
  try{const p=JSON.parse(decodeURIComponent(escape(atob(b64))));return p&&p.playerNames?p:null;}catch{return null;}
}
function buildSaveURL(state){
  return location.href.split("?")[0]+"?d="+encodeState(state);
}
function loadFromURL(){
  const p=new URLSearchParams(location.search).get("d");
  return p?decodeState(p):null;
}
function mergeState(saved){
  const fresh=initState();
  return {...fresh,...saved,
    groupDraw:saved.groupDraw||fresh.groupDraw,
    groupMatches:saved.groupMatches||fresh.groupMatches,
    koDraw:saved.koDraw||fresh.koDraw,
    koMatches:saved.koMatches||fresh.koMatches,
    playerNames:(saved.playerNames&&saved.playerNames.length===4)?saved.playerNames:fresh.playerNames,
  };
}

let saveURL="";
function updateSaveBar(){
  saveURL=buildSaveURL(S);
  const box=document.getElementById("saveUrlBox");
  const btn=document.getElementById("copyBtn");
  if(box) box.textContent=saveURL;
  if(btn){btn.disabled=false;btn.classList.remove("copied");btn.textContent="Copy URL";}
}
function save(){
  dbSave(S);
  updateSaveBar();
}
function update(fn){fn(S);save();render();}

function copyURL(){
  if(!saveURL) return;
  const btn=document.getElementById("copyBtn");
  navigator.clipboard.writeText(saveURL).then(()=>{
    btn.textContent="✓ Copied!";btn.classList.add("copied");
    setTimeout(()=>{btn.textContent="Copy URL";btn.classList.remove("copied");},2500);
  }).catch(()=>{
    const el=document.createElement("textarea");el.value=saveURL;
    document.body.appendChild(el);el.select();document.execCommand("copy");
    document.body.removeChild(el);
    btn.textContent="✓ Copied!";btn.classList.add("copied");
    setTimeout(()=>{btn.textContent="Copy URL";btn.classList.remove("copied");},2500);
  });
}

// ── POINTS ────────────────────────────────────────────────────────────────────
function pts(gf,ga){return gf>ga?3:gf===ga?1:0;}
function computeTable(){
  const stats=S.playerNames.map(name=>({name,played:0,won:0,drawn:0,lost:0,gf:0,ga:0,gd:0,pts:0}));
  GROUP_KEYS.forEach(g=>{
    S.groupMatches[g].forEach(m=>{
      if(!m.played) return;
      const hg=parseInt(m.homeGoals),ag=parseInt(m.awayGoals);
      if(isNaN(hg)||isNaN(ag)) return;
      const ho=S.groupDraw[g][m.home],ao=S.groupDraw[g][m.away];
      [[ho,hg,ag],[ao,ag,hg]].forEach(([pi,gf,ga])=>{
        if(pi===null||pi===undefined||pi<0) return;
        const s=stats[pi];
        s.played++;s.gf+=gf;s.ga+=ga;s.gd+=gf-ga;s.pts+=pts(gf,ga);
        if(gf>ga)s.won++;else if(gf===ga)s.drawn++;else s.lost++;
      });
    });
  });
  KO_ROUNDS.forEach(({key})=>{
    S.koMatches[key].forEach(m=>{
      if(!m.played) return;
      const g1=parseInt(m.goals1),g2=parseInt(m.goals2);
      if(isNaN(g1)||isNaN(g2)) return;
      [0,1,2,3].forEach(pi=>{
        const draw=S.koDraw[key][pi]||[];
        const h1=m.team1&&draw.includes(m.team1),h2=m.team2&&draw.includes(m.team2);
        if(h1){const s=stats[pi];s.played++;s.gf+=g1;s.ga+=g2;s.gd+=g1-g2;s.pts+=pts(g1,g2);if(g1>g2)s.won++;else if(g1===g2)s.drawn++;else s.lost++;}
        if(h2){const s=stats[pi];s.played++;s.gf+=g2;s.ga+=g1;s.gd+=g2-g1;s.pts+=pts(g2,g1);if(g2>g1)s.won++;else if(g2===g1)s.drawn++;else s.lost++;}
      });
    });
  });
  return stats.sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf);
}

  let h=`<table><thead><tr>`;
  cols.forEach((c,i)=>h+=`<th class="${i===1?'left':''}">${c}</th>`);
  h+=`</tr></thead><tbody>`;
  rows.forEach((r,i)=>{
    const pi=S.playerNames.indexOf(r.name);

}

// ── BRACKET ───────────────────────────────────────────────────────────────────
function getOwnerColor(team){
  if(!team) return "#333";
  for(const r of KO_ROUNDS)
    for(let pi=0;pi<4;pi++)
      if((S.koDraw[r.key][pi]||[]).includes(team)) return PLAYER_COLORS[pi];
  return "#888";
}
function renderBracket(){
  const rounds=[...KO_ROUNDS.map(r=>({
    label:r.key==="r32"?"R32":r.key==="r16"?"R16":r.key==="qf"?"QF":r.key==="sf"?"SF":r.key==="third"?"3rd":"🏆",
    matches:S.koMatches[r.key]
  }))];
  let h=`<div class="section-label">KO Bracket — Official Match Numbers</div><div class="bracket-wrap"><div class="bracket">`;
  rounds.forEach(({label,matches})=>{
    h+=`<div class="bracket-col"><div class="bracket-col-label">${label}</div>`;
    matches.forEach(m=>{
      const c1=getOwnerColor(m.team1),c2=getOwnerColor(m.team2);
      const winner=m.played&&m.goals1!==""&&m.goals2!==""?(parseInt(m.goals1)>parseInt(m.goals2)?m.team1:parseInt(m.goals2)>parseInt(m.goals1)?m.team2:"D"):null;
      const d1=winner&&winner!==m.team1?"opacity:.35":"";
      const d2=winner&&winner!==m.team2?"opacity:.35":"";
      h+=`<div class="bracket-match">
        <div class="bracket-match-num">M${m.matchNum}</div>
        <div class="flex gap4 items-center mb4">
          <span class="bracket-team flex-1" style="color:${c1};${d1}">${esc(m.team1||"TBD")}</span>
          <span class="bracket-score">${m.played?m.goals1:""}</span>
        </div>
        <div class="flex gap4 items-center">
          <span class="bracket-team flex-1" style="color:${c2};${d2}">${esc(m.team2||"TBD")}</span>
          <span class="bracket-score">${m.played?m.goals2:""}</span>
        </div>
      </div>`;
    });
    h+=`</div>`;
  });
  h+=`</div></div><div class="flex flex-wrap gap12 mt16">`;
  S.playerNames.forEach((n,i)=>h+=`<div class="flex items-center gap6 fs11"><span class="player-dot" style="background:${PLAYER_COLORS[i]}"></span><span style="color:${PLAYER_COLORS[i]}">${esc(n)}</span></div>`);

      <span class="player-dot" style="background:${PLAYER_COLORS[i]};box-shadow:0 0 8px ${PLAYER_COLORS[i]}66;width:12px;height:12px"></span>
      <input type="text" value="${esc(name)}" maxlength="20" id="pname${i}"
        style="flex:1;background:#1a1a1a;border:1px solid #2a2a2a;color:${PLAYER_COLORS[i]};padding:8px 10px;border-radius:8px;font-size:14px;font-weight:700"
        onblur="update(s=>{s.playerNames[${i}]=this.value.trim()||'Player ${i+1}'})"
        onkeydown="if(event.key==='Enter'){this.blur()}">
    </div>`;
  });
  h+=`<div class="card mt16">
    <div class="section-label">↩ Restore from save URL</div>
    <div style="font-size:11px;color:#555;margin-bottom:10px;line-height:1.5">Paste your full saved URL here if you need to restore manually.</div>
    <textarea id="importBox" rows="3" placeholder="Paste full URL or just the ?d=… part…"></textarea>
    <button class="action-btn btn-purple" onclick="doImport()">Restore Data</button>
    <div id="importMsg" style="font-size:12px;margin-top:6px"></div>
  </div>
  <div class="card mt10">
    <div class="section-label">⚠ Reset All Data</div>
    <button class="action-btn btn-red" onclick="doReset()">Reset All Match Data</button>
  </div>`;
  return h;
}

function doImport(){
  let text=(document.getElementById("importBox")||{}).value||"";
  text=text.trim();
  if(text.includes("?d=")) text=text.split("?d=")[1].split("&")[0];
  const parsed=decodeState(text);
  const msg=document.getElementById("importMsg");
  if(!parsed){if(msg)msg.style.color="#e63946",msg.textContent="Invalid code.";return;}
  S=mergeState(parsed);save();render();
  if(msg)msg.style.color="#2a9d8f",msg.textContent="✓ Data restored!";
}

function doReset(){
  if(!confirm("Reset all match data? Player names will be kept. This cannot be undone.")) return;
  const names=[...S.playerNames];
  S=initState();S.playerNames=names;save();render();
}

function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function attachHandlers(){}

// ── INIT ──────────────────────────────────────────────────────────────────────
async function init(){
  // Show loading
  document.getElementById("loading").textContent="Connecting to cloud…";

  // URL seed takes priority (first-time setup)
  const fromURL=loadFromURL();
  if(fromURL){ S=mergeState(fromURL); }

  // Connect Firebase — this also starts the real-time listener
  try{
    await initFirebase();
  }catch(e){
    console.warn("Firebase failed, running offline",e);
    document.getElementById("loadStatus").textContent="⚠ Offline mode";
  }

  document.getElementById("loading").style.display="none";
  document.getElementById("app").style.display="block";
  document.querySelectorAll(".tab-btn").forEach(b=>b.classList.toggle("active",b.dataset.tab===S.activeTab));
  updateSaveBar();render();
}
init();
</script>

<script>
if('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
</script>
